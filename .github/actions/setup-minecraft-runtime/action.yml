name: Setup Minecraft 26.3 runtime
description: Install the pinned Java runtime and verified official Minecraft 26.3 server used by CI.
runs:
  using: composite
  steps:
    - name: Set up Java 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "25"

    - name: Download official Minecraft 26.3 server
      shell: bash
      run: |
        set -euo pipefail
        server_jar="${GITHUB_WORKSPACE}/server.jar"
        curl --fail --location --retry 3 \
          https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar \
          --output "$server_jar"
        echo "33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c  $server_jar" | sha1sum --check -
