name: Tag Warehouse v4.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tag-warehouse-v4.2.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag validated Warehouse v4.2 commit
        shell: bash
        run: |
          set -euo pipefail
          TAG="warehouse-v4.2"
          TARGET="2e4120a7bf4426656159c94fb3399e89fdd259d1"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 0
          fi
          git tag "$TAG" "$TARGET"
          git push origin "$TAG"
