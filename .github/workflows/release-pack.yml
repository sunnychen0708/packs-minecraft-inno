name: Release pack

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve pack from tag
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PACK="${TAG%-v*}"
          VERSION="v${TAG##*-v}"

          if [[ -d "datapacks/$PACK" ]]; then
            KIND="datapack"
          elif [[ -d "resourcepacks/$PACK" ]]; then
            KIND="resource pack"
          else
            echo "No datapacks/$PACK or resourcepacks/$PACK directory exists."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Validate datapack
        if: steps.pack.outputs.kind == 'datapack'
        shell: bash
        run: |
          set -euo pipefail
          PACK="${{ steps.pack.outputs.pack }}"
          python3 scripts/validate-datapack.py "$PACK"
          TEST_SCRIPT="scripts/test-$PACK.py"
          if [[ -f "$TEST_SCRIPT" ]]; then
            python3 "$TEST_SCRIPT"
          fi

      - name: Set up Java 25 for Warehouse runtime gate
        if: steps.pack.outputs.kind == 'datapack' && steps.pack.outputs.pack == 'warehouse'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download official Minecraft 26.3 server for Warehouse
        if: steps.pack.outputs.kind == 'datapack' && steps.pack.outputs.pack == 'warehouse'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar \
            --output server.jar
          echo "33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c  server.jar" | sha1sum --check -

      - name: Run Warehouse 26.3 runtime release gate
        if: steps.pack.outputs.kind == 'datapack' && steps.pack.outputs.pack == 'warehouse'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-warehouse-runtime.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload Warehouse runtime evidence
        if: always() && steps.pack.outputs.kind == 'datapack' && steps.pack.outputs.pack == 'warehouse'
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-release-runtime-${{ github.run_id }}
          path: dist/warehouse-runtime-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Build ZIP
        shell: bash
        run: |
          chmod +x scripts/build-pack.sh
          scripts/build-pack.sh "${{ steps.pack.outputs.pack }}" "${{ steps.pack.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.pack.outputs.tag }}" \
            "dist/${{ steps.pack.outputs.pack }}-${{ steps.pack.outputs.version }}.zip" \
            --verify-tag \
            --title "${{ steps.pack.outputs.pack }} ${{ steps.pack.outputs.version }}" \
            --generate-notes
