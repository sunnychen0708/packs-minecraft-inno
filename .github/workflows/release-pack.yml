name: Release pack

on:
  push:
    tags:
      - "*-v*"
  # Release without pushing a tag yourself: the run creates <pack>-v<version> on the main commit
  # it ran on, after every gate below has passed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on main, e.g. utilities-v3.7"
        required: true
        type: string

permissions:
  contents: write

# A tag pushed twice (or a push and a manual run for the same tag) starts two runs; run them one
# after the other so only one creates the release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve pack from tag
        id: pack
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual releases must run on main, not $GITHUB_REF."
              exit 1
            fi
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAG="$(python3 -c 'import json; print(json.load(open("ops/release-request.json", encoding="utf-8"))["tag"])')"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^[a-z0-9]+(-[a-z0-9]+)*-v[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like <pack>-v<major>.<minor>, for example utilities-v3.7: $TAG"
            exit 1
          fi

          PACK="${TAG%-v*}"
          VERSION="v${TAG##*-v}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Release versions must use exactly two numeric parts, for example v1.6 or v4.5: $VERSION"
            exit 1
          fi

          if [[ -d "datapacks/$PACK" ]]; then
            KIND="datapack"
          elif [[ -d "resourcepacks/$PACK" ]]; then
            KIND="resource pack"
          else
            echo "No datapacks/$PACK or resourcepacks/$PACK directory exists."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Check an existing tag points at this commit
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.pack.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail before the gates if the tag already names another commit; never move a tag.
          remote="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if [[ -z "$remote" ]]; then
            echo "Tag $TAG does not exist yet; it will be created on $GITHUB_SHA after the gates pass."
            exit 0
          fi
          peeled="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<<"$remote")"
          target="${peeled:-$(awk '{print $1; exit}' <<<"$remote")}"
          if [[ "$target" != "$GITHUB_SHA" ]]; then
            echo "Tag $TAG already points at $target, not at this run's commit $GITHUB_SHA."
            exit 1
          fi
          echo "Tag $TAG already points at $GITHUB_SHA."

      - name: Verify datapack source version matches tag
        if: steps.pack.outputs.kind == 'datapack'
        env:
          PACK: ${{ steps.pack.outputs.pack }}
          TAG_VERSION: ${{ steps.pack.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          meta = json.loads((Path("datapacks") / os.environ["PACK"] / "pack.mcmeta").read_text(encoding="utf-8"))
          description = str(meta["pack"]["description"])
          match = re.search(r"v(\d+\.\d+)(?!\.\d)", description)
          if not match:
              raise SystemExit(f"pack.mcmeta description has no semantic version: {description}")
          source_version = f"v{match.group(1)}"
          if source_version != os.environ["TAG_VERSION"]:
              raise SystemExit(
                  f"tag/source version mismatch: tag={os.environ['TAG_VERSION']} source={source_version}"
              )
          print(f"release version contract OK: {source_version}")
          PY

      - name: Validate datapack
        if: steps.pack.outputs.kind == 'datapack'
        shell: bash
        run: |
          set -euo pipefail
          PACK="${{ steps.pack.outputs.pack }}"
          python3 scripts/validate-datapack.py "$PACK"
          TEST_SCRIPT="scripts/test-$PACK.py"
          if [[ -f "$TEST_SCRIPT" ]]; then
            python3 "$TEST_SCRIPT"
          fi

      - name: Set up Minecraft 26.3 runtime
        if: steps.pack.outputs.kind == 'datapack'
        uses: ./.github/actions/setup-minecraft-runtime

      - name: Run all-datapacks 26.3 compatibility release gate
        if: steps.pack.outputs.kind == 'datapack'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-datapack-compatibility.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload all-datapacks release compatibility evidence
        if: always() && steps.pack.outputs.kind == 'datapack'
        uses: actions/upload-artifact@v7
        with:
          name: all-datapacks-release-compatibility-${{ github.run_id }}
          path: dist/all-datapacks-runtime-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Warehouse 26.3 runtime release gate
        if: steps.pack.outputs.kind == 'datapack' && steps.pack.outputs.pack == 'warehouse'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-warehouse-runtime.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload Warehouse runtime evidence
        if: always() && steps.pack.outputs.kind == 'datapack' && steps.pack.outputs.pack == 'warehouse'
        uses: actions/upload-artifact@v7
        with:
          name: warehouse-release-runtime-${{ github.run_id }}
          path: dist/warehouse-runtime-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Utilities 26.3 runtime release gate
        if: steps.pack.outputs.kind == 'datapack' && steps.pack.outputs.pack == 'utilities'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-utilities.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload Utilities runtime evidence
        if: always() && steps.pack.outputs.kind == 'datapack' && steps.pack.outputs.pack == 'utilities'
        uses: actions/upload-artifact@v7
        with:
          name: utilities-release-runtime-${{ github.run_id }}
          path: dist/utilities-test-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Boot official 26.3 server and reload Copy/Paste
        if: steps.pack.outputs.kind == 'datapack' && steps.pack.outputs.pack == 'copy-paste'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-datapack.py copy-paste \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Run Copy/Paste behavioral runtime release gate
        if: steps.pack.outputs.kind == 'datapack' && steps.pack.outputs.pack == 'copy-paste'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-copy-paste-runtime.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload Copy/Paste runtime evidence
        if: always() && steps.pack.outputs.kind == 'datapack' && steps.pack.outputs.pack == 'copy-paste'
        uses: actions/upload-artifact@v7
        with:
          name: copy-paste-release-runtime-${{ github.run_id }}
          path: |
            dist/validation/copy-paste-*
            dist/copy-paste-runtime-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Build ZIP
        shell: bash
        run: |
          chmod +x scripts/build-pack.sh
          scripts/build-pack.sh "${{ steps.pack.outputs.pack }}" "${{ steps.pack.outputs.version }}"

      - name: Create tag on main
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.pack.outputs.tag }}
          TITLE: ${{ steps.pack.outputs.pack }} ${{ steps.pack.outputs.version }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git ls-remote origin "refs/tags/$TAG")" ]]; then
            echo "Tag $TAG already exists (checked before the gates)."
            exit 0
          fi
          # Annotated like the hand-pushed tags, tagged by whoever started the run. A tag pushed
          # with GITHUB_TOKEN does not start another run of this workflow.
          git -c user.name="$ACTOR" -c user.email="${ACTOR_ID}+${ACTOR}@users.noreply.github.com" \
            tag -a "$TAG" -m "$TITLE" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pack.outputs.tag }}
          ZIP: dist/${{ steps.pack.outputs.pack }}-${{ steps.pack.outputs.version }}.zip
          TITLE: ${{ steps.pack.outputs.pack }} ${{ steps.pack.outputs.version }}
          PACK: ${{ steps.pack.outputs.pack }}
        shell: bash
        run: |
          set -euo pipefail
          # Idempotent: a re-run or a second run for the same tag refreshes the asset of the
          # existing release (built from the same tag after the same gates) instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading the asset to it."
            gh release upload "$TAG" "$ZIP" --clobber
            exit 0
          fi
          # Generated notes otherwise start at the repository's previous tag, which may belong to
          # another pack. Start at this pack's previous version instead (two- or three-part, so
          # older releases count; vanilla-utilities-v3.2 is not a utilities tag).
          prev="$(git ls-remote --tags origin "refs/tags/${PACK}-v*" \
            | awk '{print $2}' | sed 's#^refs/tags/##' \
            | { grep -E "^${PACK}-v[0-9]+\.[0-9]+(\.[0-9]+)?$" || true; } \
            | { cat; echo "$TAG"; } | sort -uV | grep -B1 -xF "$TAG" | head -n1)"
          notes=(--generate-notes)
          if [[ "$prev" != "$TAG" ]]; then
            echo "Release notes start at $prev."
            notes+=(--notes-start-tag "$prev")
          else
            echo "No earlier $PACK release; notes cover the whole history."
          fi
          gh release create "$TAG" "$ZIP" --verify-tag --title "$TITLE" "${notes[@]}"
