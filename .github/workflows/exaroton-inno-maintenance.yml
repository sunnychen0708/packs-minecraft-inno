name: inno offline UUID maintenance

on:
  push:
    branches:
      - main
    paths:
      - "ops/inno-maintenance-request.json"

permissions:
  contents: read

concurrency:
  group: inno-offline-uuid-maintenance
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve maintenance request
        id: request
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("ops/inno-maintenance-request.json", encoding="utf-8") as handle:
              request = json.load(handle)

          op = request.get("operation")
          if op == "noop":
              mode = "noop"
          elif op == "uuid-migrate-dry-run":
              mode = "dry-run"
          elif op == "uuid-migrate-apply":
              mode = "apply"
          else:
              raise SystemExit(f"unsupported maintenance operation: {op!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"mode={mode}\n")
          PY

      - name: No-op request
        if: steps.request.outputs.mode == 'noop'
        run: echo "Production maintenance request is idle (noop)."

      - name: Install NBT parser
        if: steps.request.outputs.mode != 'noop'
        run: python3 -m pip install "nbtlib==1.12.1"

      - name: Run requested offline maintenance
        if: steps.request.outputs.mode != 'noop'
        shell: bash
        env:
          EXAROTON_API_TOKEN: ${{ secrets.EXAROTON_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - "${{ steps.request.outputs.mode }}" <<'PY'
          import sys
          import exaroton_inno_uuid_migrate as migration

          mode = sys.argv[1]
          original_remote_path = migration.remote_path
          migration.remote_path = lambda p: original_remote_path(str(p).lstrip("/"))
          migration.plan_or_apply(mode)
          PY
