name: inno offline UUID maintenance

on:
  push:
    branches:
      - main
    paths:
      - "ops/inno-maintenance-request.json"

permissions:
  contents: read

concurrency:
  group: inno-offline-uuid-maintenance
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve maintenance request
        id: request
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("ops/inno-maintenance-request.json", encoding="utf-8") as handle:
              request = json.load(handle)

          op = request.get("operation")
          if op == "noop":
              mode, scope = "noop", "none"
          elif op == "uuid-migrate-dry-run":
              mode, scope = "dry-run", "all"
          elif op == "uuid-migrate-apply":
              mode, scope = "apply", "all"
          elif op == "uuid-region-probe":
            mode, scope = "audit", "region-probe"
          elif op == "uuid-owners-audit":
            mode, scope = "audit", "owners"
          elif op == "uuid-stats-dry-run":
              mode, scope = "dry-run", "stats"
          elif op == "uuid-stats-apply":
              mode, scope = "apply", "stats"
          elif op == "datapacks-apply":
              mode, scope = "apply", "datapacks"
          else:
              raise SystemExit(f"unsupported maintenance operation: {op!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"mode={mode}\n")
              output.write(f"scope={scope}\n")
          PY

      - name: No-op request
        if: steps.request.outputs.mode == 'noop'
        run: echo "Production maintenance request is idle (noop)."

      - name: Install NBT parser
        if: steps.request.outputs.mode != 'noop' && steps.request.outputs.scope != 'datapacks'
        run: python3 -m pip install "nbtlib==1.12.1"

      - name: Download verified datapack releases
        if: steps.request.outputs.scope == 'datapacks'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/inno-deploy
          gh release download utilities-v3.8 -p utilities-v3.8.zip -D dist/inno-deploy --clobber
          gh release download warehouse-v4.7 -p warehouse-v4.7.zip -D dist/inno-deploy --clobber
          gh release download copy-paste-v1.8 -p copy-paste-v1.8.zip -D dist/inno-deploy --clobber
          cd dist/inno-deploy
          {
            echo "83972f44606a21d7746c564ce2644c574987ecafadae0af2bca281399bd6222a  utilities-v3.8.zip"
            echo "fd5716d11d078d9679a481fd54b308ba7306a27a743e4b2ee97653024b7fb53b  warehouse-v4.7.zip"
            echo "73d9294b8b100a9ad1ffa168b401afe32d867db228e91140b1a68c36d186111d  copy-paste-v1.8.zip"
          } | sha256sum -c -

      - name: Deploy verified datapacks while production is offline
        if: steps.request.outputs.scope == 'datapacks'
        shell: bash
        env:
          EXAROTON_API_TOKEN: ${{ secrets.EXAROTON_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/exaroton_inno_datapack_deploy.py

      - name: Run requested maintenance or read-only animal audit
        if: steps.request.outputs.mode != 'noop' && steps.request.outputs.scope != 'datapacks'
        shell: bash
        env:
          EXAROTON_API_TOKEN: ${{ secrets.EXAROTON_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - "${{ steps.request.outputs.mode }}" "${{ steps.request.outputs.scope }}" <<'PY'
          import sys
          import exaroton_inno_uuid_migrate as migration

          mode, scope = sys.argv[1], sys.argv[2]
          original_remote_path = migration.remote_path
          migration.remote_path = lambda p: original_remote_path(str(p).lstrip("/"))

          if scope == "stats":
              import exaroton_inno_stats_merge as stats_merge
              stats_merge.plan_or_apply(mode)
              raise SystemExit(0)

          # Exaroton's binary file endpoint must be called without the trailing
          # slash used by ordinary text/config reads. A zero-byte .mca response
          # is only accepted when file metadata also reports size=0.
          def _read_file_optional(self, path):
              try:
                  data = self.req(
                      "GET",
                      f"/servers/{self._sidq()}/files/data/{migration.remote_path(path)}",
                      raw_response=True,
                  )
                  if data == b"" and str(path).endswith(".mca"):
                      info = self.info_optional(path)
                      size = int((info or {}).get("size") or 0)
                      if size == 0:
                          print(f"skipping empty region file: {path}")
                          return None
                      raise migration.Error(
                          f"binary region download returned 0 bytes for {path} "
                          f"but exaroton reports size={size}"
                      )
                  return data
              except migration.Error as exc:
                  if "HTTP 404" in str(exc):
                      return None
                  raise

          migration.Client.read_file_optional = _read_file_optional
          if scope == "region-probe":
              from inno_region_integrity_probe import run
              run()
              raise SystemExit(0)
          if scope == "owners":
              from inno_animal_owner_audit import audit_animal_owners
              audit_animal_owners(migration.Client(__import__("os").environ.get("EXAROTON_API_TOKEN", "")))
              raise SystemExit(0)
          migration.plan_or_apply(mode)
          PY
