name: Warehouse v4.2 real upgrade audit once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/warehouse-v4.2-real-upgrade-audit-once.yml"

permissions:
  contents: read

jobs:
  upgrade-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit harness
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download released Warehouse ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-release/v40 audit-release/v41 audit-release/v42
          gh release download warehouse-v4.0 --pattern warehouse-v4.0.zip --dir audit-release/v40
          gh release download warehouse-v4.1 --pattern warehouse-v4.1.zip --dir audit-release/v41
          gh release download warehouse-v4.2 --pattern warehouse-v4.2.zip --dir audit-release/v42
          echo "1c169e0a4606fc3670b2aa16599a09bb2735361c2908c778edb80d07315f67bb  audit-release/v40/warehouse-v4.0.zip" | sha256sum --check -
          echo "7c1d0ac0531fc15878ca9a788335862928a6a17a7c84dbab563e234d6531ee79  audit-release/v41/warehouse-v4.1.zip" | sha256sum --check -
          echo "69ddb29608b4c7e7e69b7b3df88ac7f2560c2f2a1daf59f9f9febc57512e73ba  audit-release/v42/warehouse-v4.2.zip" | sha256sum --check -

      - name: Download official Minecraft 26.3 server
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar \
            --output server.jar
          echo "33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c  server.jar" | sha1sum --check -

      - name: Run real same-world upgrade audits retry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          export TMPDIR="$PWD/dist"
          python3 scripts/test-warehouse-release-upgrade.py \
            --old-v40 "$PWD/audit-release/v40/warehouse-v4.0.zip" \
            --old-v41 "$PWD/audit-release/v41/warehouse-v4.1.zip" \
            --new-v42 "$PWD/audit-release/v42/warehouse-v4.2.zip" \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar"

      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-v4.2-real-upgrade-${{ github.run_id }}
          path: |
            dist/warehouse-upgrade-*/v40-old.log
            dist/warehouse-upgrade-*/v40-v42.log
            dist/warehouse-upgrade-*/v41-old.log
            dist/warehouse-upgrade-*/v41-v42.log
          if-no-files-found: ignore
          retention-days: 14
