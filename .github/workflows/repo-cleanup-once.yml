name: one-time 26.3 path cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repo-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix stale Java 26.3 player paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/exaroton_innotest.py")
          text = path.read_text(encoding="utf-8")

          replacements = {
              'f"{world}/playerdata"': 'f"{world}/players/data"',
              'f"{world}/advancements"': 'f"{world}/players/advancements"',
              'f"{world}/stats"': 'f"{world}/players/stats"',
              '("playerdata", ".dat")': '("players/data", ".dat")',
              '("playerdata", ".dat_old")': '("players/data", ".dat_old")',
              '("advancements", ".json")': '("players/advancements", ".json")',
              '("stats", ".json")': '("players/stats", ".json")',
          }

          expected_counts = {
              'f"{world}/playerdata"': 1,
              'f"{world}/advancements"': 1,
              'f"{world}/stats"': 1,
              '("playerdata", ".dat")': 1,
              '("playerdata", ".dat_old")': 1,
              '("advancements", ".json")': 1,
              '("stats", ".json")': 1,
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != expected_counts[old]:
                  raise SystemExit(f"refusing cleanup: expected {expected_counts[old]} occurrence(s) of {old!r}, found {count}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

          python3 -m py_compile scripts/exaroton_innotest.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/exaroton_innotest.py; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git config user.name "sunnychen0708"
          git config user.email "144662040+sunnychen0708@users.noreply.github.com"
          git add scripts/exaroton_innotest.py
          git commit -m "Use Java 26.3 player paths in exaroton helpers"
          git push origin HEAD:main
