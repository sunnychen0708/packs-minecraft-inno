name: Release Cat Door Sounds v1.0

on:
  push:
    paths:
      - ".github/workflows/release-cat-door-sounds-v1.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release metadata and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          s = s.replace("| `cat-door-sounds` | Resource pack | — |", "| `cat-door-sounds` | Resource pack | `v1.0` |")
          if "- Cat Door Sounds v1.0" not in s:
              s = s.replace("- Warehouse v4.0\n", "- Warehouse v4.0\n- Cat Door Sounds v1.0\n")
          p.write_text(s)
          PY
          rm .github/workflows/release-cat-door-sounds-v1.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/release-cat-door-sounds-v1.0.yml
          git commit -m "Release cat-door-sounds v1.0"
          git push

      - name: Build release ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (
            cd resourcepacks/cat-door-sounds
            zip -qr ../../dist/cat-door-sounds-v1.0.zip .
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create cat-door-sounds-v1.0             dist/cat-door-sounds-v1.0.zip             --target main             --title "Cat Door Sounds v1.0"             --notes "Minecraft Java 26.2 resource pack. Replaces normal cat ambient meows with a custom sound and layers a custom sound over vanilla wooden-door opening sounds. Original package: Minecraft_Java_26.2_Cat_Meow_and_Door_Open.zip."
