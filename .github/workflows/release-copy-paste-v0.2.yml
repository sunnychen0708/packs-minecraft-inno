name: Bootstrap copy-paste v0.2 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-copy-paste-v0.2.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build copy-paste v0.2
        shell: bash
        run: |
          chmod +x scripts/build-pack.sh
          scripts/build-pack.sh copy-paste v0.2

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view copy-paste-v0.2 >/dev/null 2>&1; then
            echo "Release already exists."
            exit 0
          fi

          gh release create copy-paste-v0.2 \
            "dist/copy-paste-v0.2.zip" \
            --target "${GITHUB_SHA}" \
            --title "copy-paste v0.2" \
            --notes "Fixes crosshair selection and paste raycasts so they start from the player's actual position and view direction. Also aligns hit coordinates to exact blocks, including negative coordinates."
