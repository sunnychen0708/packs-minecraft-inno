name: Release request

on:
  push:
    branches:
      - main
    paths:
      - "ops/release-request.json"

permissions:
  actions: write
  contents: write

concurrency:
  group: release-request
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          req = json.loads(Path("ops/release-request.json").read_text(encoding="utf-8"))
          op = str(req.get("operation") or "")
          if op == "noop":
              print("run=false")
              print("mode=noop")
              print("tag=")
              raise SystemExit(0)
          if op not in {"release", "release-direct", "edit-release-notes"}:
              raise SystemExit(f"unsupported release request operation: {op!r}")

          tag = str(req.get("tag") or "")
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*-v\d+\.\d+", tag):
              raise SystemExit(f"invalid release tag: {tag!r}")

          print("run=true")
          print(f"mode={op}")
          print(f"tag={tag}")
          PY

      - name: No-op request
        if: steps.request.outputs.run != 'true'
        run: echo "Release request is idle (noop)."

      - name: Dispatch release workflow
        if: steps.request.outputs.run == 'true' && steps.request.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: gh workflow run release-pack.yml --ref main -f tag="$TAG"

      - name: Direct release without gates
        if: steps.request.outputs.run == 'true' && steps.request.outputs.mode == 'release-direct'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        shell: bash
        run: |
          set -euo pipefail
          PACK="${TAG%-v*}"
          VERSION="v${TAG##*-v}"
          chmod +x scripts/build-pack.sh
          scripts/build-pack.sh "$PACK" "$VERSION"
          ZIP="dist/${PACK}-${VERSION}.zip"
          TITLE="$PACK $VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            exit 0
          fi
          git -c user.name="$ACTOR" -c user.email="${ACTOR_ID}+${ACTOR}@users.noreply.github.com" tag -a "$TAG" -m "$TITLE" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          prev="$(git ls-remote --tags origin "refs/tags/${PACK}-v*" | awk '{print $2}' | sed 's#^refs/tags/##' | { grep -E "^${PACK}-v[0-9]+\.[0-9]+(\.[0-9]+)?$" || true; } | { cat; echo "$TAG"; } | sort -uV | grep -B1 -xF "$TAG" | head -n1)"
          notes=(--generate-notes)
          if [[ "$prev" != "$TAG" ]]; then notes+=(--notes-start-tag "$prev"); fi
          gh release create "$TAG" "$ZIP" --verify-tag --title "$TITLE" "${notes[@]}"

      - name: Edit existing release notes
        if: steps.request.outputs.run == 'true' && steps.request.outputs.mode == 'edit-release-notes'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body > /tmp/release-notes.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/release-notes.md")
          text = p.read_text(encoding="utf-8")
          old = "不再每 tick 掃 31 次 @a by @sunnychen0708"
          new = "不再每 tick 掃 31 次 `@a` by @sunnychen0708"
          if old not in text:
              raise SystemExit("target release-note text not found")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY
          gh release edit "$TAG" --notes-file /tmp/release-notes.md
