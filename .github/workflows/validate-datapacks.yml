name: Validate datapacks

on:
  pull_request:
    paths:
      - "datapacks/**"
      - "scripts/**"
      - "docs/datapack-validation.md"
      - ".github/workflows/validate-datapacks.yml"
      - ".github/workflows/release-pack.yml"
      - ".github/actions/setup-minecraft-runtime/**"
  push:
    branches:
      - main
    paths:
      - "datapacks/**"
      - "scripts/**"
      - "docs/datapack-validation.md"
      - ".github/workflows/validate-datapacks.yml"
      - ".github/workflows/release-pack.yml"
      - ".github/actions/setup-minecraft-runtime/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate utilities generic
        run: python3 scripts/validate-datapack.py utilities

      - name: Validate utilities regression
        run: python3 scripts/test-utilities.py

      - name: Validate copy-paste generic
        run: python3 scripts/validate-datapack.py copy-paste

      - name: Validate copy-paste regression
        run: python3 scripts/test-copy-paste.py

      - name: Validate warehouse generic
        run: python3 scripts/validate-datapack.py warehouse

      - name: Validate warehouse regression
        run: python3 scripts/test-warehouse.py

      - name: Build Copy/Paste opt-in live harnesses
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build-copy-paste-live-test.py scripts/build-copy-paste-multiplayer-test.py
          python3 scripts/build-copy-paste-live-test.py --output /tmp/mcc-live-test
          python3 scripts/build-copy-paste-multiplayer-test.py

  warehouse-runtime-smoke:
    name: Warehouse vanilla 26.3 reset regression
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Minecraft 26.3 runtime
        uses: ./.github/actions/setup-minecraft-runtime

      - name: Run Warehouse registration-reset runtime regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-warehouse-runtime.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload Warehouse runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: warehouse-26.3-runtime-${{ github.run_id }}
          path: dist/warehouse-runtime-*
          if-no-files-found: ignore
          retention-days: 14


  copy-paste-runtime-smoke:
    name: Copy/Paste vanilla 26.3 smoke
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Minecraft 26.3 runtime
        uses: ./.github/actions/setup-minecraft-runtime

      - name: Boot official 26.3 server and reload Copy/Paste
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-datapack.py copy-paste \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Run Copy/Paste behavioral regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-copy-paste-runtime.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload vanilla smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copy-paste-26.3-smoke-${{ github.run_id }}
          path: |
            dist/validation/copy-paste-*
            dist/copy-paste-runtime-*
          if-no-files-found: ignore
          retention-days: 14

