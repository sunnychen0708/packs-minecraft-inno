name: Validate datapacks

on:
  pull_request:
    paths:
      - "datapacks/**"
      - "scripts/**"
      - "docs/datapack-validation.md"
      - ".github/workflows/validate-datapacks.yml"
      - ".github/workflows/release-pack.yml"
      - ".github/actions/setup-minecraft-runtime/**"
  push:
    branches:
      - main
    paths:
      - "datapacks/**"
      - "scripts/**"
      - "docs/datapack-validation.md"
      - ".github/workflows/validate-datapacks.yml"
      - ".github/workflows/release-pack.yml"
      - ".github/actions/setup-minecraft-runtime/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test exaroton UUID migration helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "nbtlib==1.12.1"
          python3 -m py_compile scripts/exaroton_innotest.py scripts/exaroton_inno_uuid_migrate.py
          python3 scripts/test-exaroton-migrations.py

      - name: Check generated Blueprint matcher is up to date
        run: python3 scripts/gen-blueprint-matcher.py --check

      - name: Validate every datapack
        shell: bash
        run: |
          set -euo pipefail
          for dir in datapacks/*; do
            [[ -d "$dir" ]] || continue
            pack="$(basename "$dir")"
            echo "::group::Generic validation: $pack"
            python3 scripts/validate-datapack.py "$pack"
            echo "::endgroup::"

            test_script="scripts/test-$pack.py"
            if [[ -f "$test_script" ]]; then
              echo "::group::Pack regression: $pack"
              python3 "$test_script"
              echo "::endgroup::"
            fi
          done

          echo "::group::Cross-pack static compatibility"
          python3 scripts/test-datapack-compatibility.py
          echo "::endgroup::"

      # Only proves the Trigger harnesses can be generated. No real player runs them here, and
      # scripts/real-client/ (Windows client) is not run in CI at all.
      - name: Build Copy/Paste opt-in live harnesses (generate only, not run)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build-copy-paste-live-test.py scripts/build-copy-paste-multiplayer-test.py
          python3 scripts/build-copy-paste-live-test.py --output /tmp/mcc-live-test
          python3 scripts/build-copy-paste-multiplayer-test.py

  warehouse-runtime-smoke:
    name: Warehouse vanilla 26.3 reset regression
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Minecraft 26.3 runtime
        uses: ./.github/actions/setup-minecraft-runtime

      - name: Run Warehouse registration-reset runtime regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-warehouse-runtime.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload Warehouse runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: warehouse-26.3-runtime-${{ github.run_id }}
          path: dist/warehouse-runtime-*
          if-no-files-found: ignore
          retention-days: 14


  utilities-runtime-smoke:
    name: Utilities vanilla 26.3 regression
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Minecraft 26.3 runtime
        uses: ./.github/actions/setup-minecraft-runtime

      - name: Run Utilities runtime regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-utilities.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload Utilities runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: utilities-26.3-runtime-${{ github.run_id }}
          path: dist/utilities-test-*
          if-no-files-found: ignore
          retention-days: 14


  copy-paste-runtime-smoke:
    name: Copy/Paste vanilla 26.3 smoke
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Minecraft 26.3 runtime
        uses: ./.github/actions/setup-minecraft-runtime

      - name: Boot official 26.3 server and reload Copy/Paste
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-datapack.py copy-paste \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Run Copy/Paste behavioral regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-copy-paste-runtime.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload vanilla smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copy-paste-26.3-smoke-${{ github.run_id }}
          path: |
            dist/validation/copy-paste-*
            dist/copy-paste-runtime-*
          if-no-files-found: ignore
          retention-days: 14


  all-datapacks-runtime-smoke:
    name: All datapacks vanilla 26.3 compatibility
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Minecraft 26.3 runtime
        uses: ./.github/actions/setup-minecraft-runtime

      - name: Run all-datapacks compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-datapack-compatibility.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload all-datapacks runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: all-datapacks-26.3-compatibility-${{ github.run_id }}
          path: dist/all-datapacks-runtime-*
          if-no-files-found: ignore
          retention-days: 14
