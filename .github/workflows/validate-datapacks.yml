name: Validate datapacks

on:
  pull_request:
    paths:
      - "datapacks/**"
      - "scripts/**"
      - "docs/datapack-validation.md"
      - ".github/workflows/validate-datapacks.yml"
      - ".github/workflows/release-pack.yml"
  push:
    branches:
      - main
    paths:
      - "datapacks/**"
      - "scripts/**"
      - "docs/datapack-validation.md"
      - ".github/workflows/validate-datapacks.yml"
      - ".github/workflows/release-pack.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate every datapack
        shell: bash
        run: |
          set -euo pipefail
          for dir in datapacks/*; do
            [[ -d "$dir" ]] || continue
            pack="$(basename "$dir")"
            echo "::group::Generic validation: $pack"
            python3 scripts/validate-datapack.py "$pack"
            echo "::endgroup::"

            test_script="scripts/test-$pack.py"
            if [[ -f "$test_script" ]]; then
              echo "::group::Pack regression: $pack"
              python3 "$test_script"
              echo "::endgroup::"
            fi
          done

      - name: Build Copy/Paste opt-in live harnesses
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build-copy-paste-live-test.py scripts/build-copy-paste-multiplayer-test.py
          python3 scripts/build-copy-paste-live-test.py --output /tmp/mcc-live-test
          python3 scripts/build-copy-paste-multiplayer-test.py

  warehouse-runtime-smoke:
    name: Warehouse vanilla 26.3 reset regression
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download official Minecraft 26.3 server
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar \
            --output server.jar
          echo "33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c  server.jar" | sha1sum --check -

      - name: Run Warehouse registration-reset runtime regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-warehouse-runtime.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload Warehouse runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-26.3-runtime-${{ github.run_id }}
          path: dist/warehouse-runtime-*
          if-no-files-found: ignore
          retention-days: 14


  copy-paste-runtime-smoke:
    name: Copy/Paste vanilla 26.3 smoke
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download official Minecraft 26.3 server
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar \
            --output server.jar
          echo "33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c  server.jar" | sha1sum --check -

      - name: Boot official 26.3 server and reload Copy/Paste
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-datapack.py copy-paste \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Run Copy/Paste v1.0 behavioral regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-copy-paste-runtime.py \
            --java "$(command -v java)" \
            --server-jar "$PWD/server.jar" \
            --accept-eula

      - name: Upload vanilla smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copy-paste-26.3-smoke-${{ github.run_id }}
          path: |
            dist/validation/copy-paste-*
            dist/copy-paste-runtime-*
          if-no-files-found: ignore
          retention-days: 14


  release-copy-paste-v1:
    name: Publish Copy/Paste v1.0
    needs: copy-paste-runtime-smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure validated v1.0 tag exists
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Minecraft Copy/Paste v1.0' datapacks/copy-paste/pack.mcmeta
          if ! git ls-remote --exit-code --tags origin refs/tags/copy-paste-v1.0 >/dev/null 2>&1; then
            git tag copy-paste-v1.0 "$GITHUB_SHA"
            git push origin copy-paste-v1.0
          fi

      - name: Build tagged v1.0 ZIP
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git checkout --detach copy-paste-v1.0
          python3 scripts/validate-datapack.py copy-paste
          python3 scripts/test-copy-paste.py
          chmod +x scripts/build-pack.sh
          scripts/build-pack.sh copy-paste v1.0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view copy-paste-v1.0 >/dev/null 2>&1; then
            echo "copy-paste-v1.0 release already exists"
            exit 0
          fi
          gh release create copy-paste-v1.0             dist/copy-paste-v1.0.zip             --verify-tag             --title "copy-paste v1.0"             --generate-notes
