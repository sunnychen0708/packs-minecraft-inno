name: one-time live test error gate patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-test-error-gate-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Harden current-run log validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/exaroton_innotest.py")
          text = path.read_text(encoding="utf-8")

          old1 = '''    # Deploy the exact datapacks from the checked-out main commit first.
    deploy(client, "all")
'''
          new1 = '''    # Mark the whole deployment/test session before any reload so parser/load
    # errors from this attempt cannot be hidden by a later PASS line.
    session_marker = f"MCCMP_SESSION_{int(time.time() * 1000)}"
    client.command(f"say {session_marker} START")
    time.sleep(1)

    # Deploy the exact datapacks from the checked-out main commit first.
    deploy(client, "all")
'''

          old2 = '''    client.command("reload")
    time.sleep(6)

    server = wait_players(client, 4, 180)
'''
          new2 = '''    client.command("reload")
    time.sleep(6)

    # Preflight only the current session. Historical errors earlier in the
    # persistent exaroton log are irrelevant, but any new server ERROR after
    # this session marker makes the live regression invalid.
    preflight_log = client.log()
    session_at = preflight_log.rfind(f"{session_marker} START")
    if session_at < 0:
        raise Error("live multiplayer preflight marker not found in server log")
    preflight_segment = preflight_log[session_at:]
    preflight_errors = [
        line for line in preflight_segment.splitlines()
        if "/ERROR]:" in line
    ]
    if preflight_errors:
        try:
            client.delete_file(remote_harness)
        finally:
            try:
                client.command("reload")
            except Error:
                pass
        preview = "\n".join(preflight_errors[:12])
        raise Error(
            "live multiplayer preflight found current-session server errors:\n"
            + preview
        )

    server = wait_players(client, 4, 180)
'''

          old3 = '''    if "MCCMP_RESULT PASS" in result:
        print("COPY_PASTE_MULTIPLAYER_LIVE_TEST=PASS")
        return

    raise Error(
        f"live multiplayer test did not pass; "
        f"current-run result={result or '<missing>'}"
    )
'''
          new3 = '''    current_errors = [
        line for line in segment.splitlines()
        if "/ERROR]:" in line
    ]
    if current_errors:
        preview = "\n".join(current_errors[:12])
        raise Error(
            "live multiplayer test produced current-run server errors even "
            "though a result line was present:\n" + preview
        )

    if "MCCMP_RESULT PASS" in result:
        print("COPY_PASTE_MULTIPLAYER_LIVE_TEST=PASS")
        return

    raise Error(
        f"live multiplayer test did not pass; "
        f"current-run result={result or '<missing>'}"
    )
'''

          blocks = (
              (old1, new1, "session marker"),
              (old2, new2, "preflight"),
              (old3, new3, "result gate"),
          )
          for old, new, label in blocks:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"refusing patch: expected one {label} block, found {count}"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python3 -m py_compile scripts/exaroton_innotest.py

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sunnychen0708"
          git config user.email "144662040+sunnychen0708@users.noreply.github.com"
          git add scripts/exaroton_innotest.py
          git commit -m "Reject live test passes with current-run server errors"
          git push origin HEAD:main
