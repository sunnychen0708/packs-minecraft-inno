name: Mineflayer 26.3 innotest

on:
  push:
    branches:
      - main
    paths:
      - "ops/mineflayer-request.json"
  workflow_dispatch:
    inputs:
      duration_ms:
        description: Keep four bots connected for this many milliseconds (30s-300s)
        required: true
        default: "180000"
        type: string
      player_mode:
        description: Reserve SunnyChen for the real client, or connect all four bots
        type: choice
        default: four-bots
        options:
          - four-bots
          - three-bots-with-real-client

permissions:
  contents: read

jobs:
  # Resolving the request never touches the bot session, so a no-op push
  # (for example resetting ops/mineflayer-request.json) cannot stop bots
  # that another run is using.
  request:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.request.outputs.run }}
      duration_ms: ${{ steps.request.outputs.duration_ms }}
      names: ${{ steps.request.outputs.names }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve request
        id: request
        shell: bash
        env:
          INPUT_DURATION_MS: ${{ inputs.duration_ms }}
          INPUT_PLAYER_MODE: ${{ inputs.player_mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          run = True
          names = ""
          duration = 30000

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              duration = int(os.environ["INPUT_DURATION_MS"])
              names = "SunnyChen,penguin0531,geena0701,Felicitypeng"
              if os.environ["INPUT_PLAYER_MODE"] == "three-bots-with-real-client":
                  names = "penguin0531,geena0701,Felicitypeng"
          else:
              req = json.loads(Path("ops/mineflayer-request.json").read_text())
              op = req.get("operation")
              if op == "noop":
                  run = False
              elif op == "test-4-bots":
                  names = "SunnyChen,penguin0531,geena0701,Felicitypeng"
                  duration = int(req.get("duration_ms", 180000))
              elif op == "test-3-bots-with-real-client":
                  names = "penguin0531,geena0701,Felicitypeng"
                  duration = int(req.get("duration_ms", 180000))
              elif op == "probe-one":
                  player = str(req.get("player") or "")
                  allowed = {"SunnyChen", "penguin0531", "geena0701", "Felicitypeng"}
                  if player not in allowed:
                      raise SystemExit("unsupported probe player")
                  names = player
                  duration = int(req.get("duration_ms", 180000))
              else:
                  raise SystemExit("unsupported mineflayer request")

          if run and not 30000 <= duration <= 300000:
              raise SystemExit("duration_ms must be 30000..300000")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run={'true' if run else 'false'}\n")
              f.write(f"duration_ms={duration}\n")
              f.write(f"names={names}\n")
          PY

      - name: No-op request
        if: steps.request.outputs.run != 'true'
        run: echo "Mineflayer request is idle (noop)."

  bots:
    needs: request
    if: needs.request.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A new bot session waits for the running one to finish instead of
    # cancelling it (cancelling disconnects the bots in the middle of a test).
    concurrency:
      group: mineflayer-innotest
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build pinned Mineflayer 26.3 stack
        shell: bash
        run: python3 scripts/mineflayer26/bootstrap.py

      - name: Keep requested test bots online
        shell: bash
        env:
          MF26_HOST: innotest.exaroton.me
          MF26_BOTS: ${{ needs.request.outputs.names }}
          MF26_DURATION_MS: ${{ needs.request.outputs.duration_ms }}
        run: node scripts/mineflayer26/keepalive.js
